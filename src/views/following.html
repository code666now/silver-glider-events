<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Following — Silver Glider Events</title>
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/legal-footer.js" defer></script>
  <style>
    .following-shell { max-width:1080px; }
    .following-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px; }
    .following-card { display:flex;align-items:center;gap:18px;min-width:0;padding:18px;border:1px solid var(--sg-border-soft);border-radius:22px;background:rgba(17,17,17,.76);color:var(--sg-text);transition:transform .16s ease,border-color .16s ease; }
    .following-card:hover { transform:translateY(-2px);border-color:rgba(28,197,190,.4); }
    .following-art { width:82px;height:82px;display:flex;flex:0 0 auto;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--sg-border);border-radius:19px;background:var(--sg-surface);color:var(--sg-accent);font:700 24px var(--sg-font-display); }
    .following-art img { width:100%;height:100%;display:block;object-fit:cover; }
    .following-art img.logo { object-fit:contain;padding:7px; }
    .following-copy { min-width:0;flex:1; }
    .following-copy h2 { font-size:23px;overflow-wrap:anywhere; }
    .following-count { margin-top:5px;color:var(--sg-text-dim);font-size:13px; }
    .following-link { display:inline-block;margin-top:13px;color:var(--sg-accent);font-size:12px;font-weight:800; }
    .following-loading { padding:52px 24px;text-align:center;color:var(--sg-text-dim); }
    @media(max-width:720px) { .following-grid { grid-template-columns:1fr; } }
    @media(max-width:480px) { .following-card { padding:15px;gap:14px; }.following-art { width:70px;height:70px;border-radius:17px; } }
  </style>
</head>
<body>
  <div class="sg-shell following-shell">
    <nav id="nav"></nav>
    <h1 class="sg-page-title">Following</h1>
    <p class="sg-page-sub">Hosts, artists, venues, and promoters you follow.</p>
    <div class="following-grid" id="following-list"><p class="following-loading">Loading…</p></div>
    <div class="sg-empty" id="following-empty" hidden>
      <h3>No followed Hosts yet</h3>
      <p>Hosts you follow will appear here.</p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    renderNav('following');
    function initials(name) {
      return String(name || '').trim().split(/\s+/).slice(0, 2).map(part => part[0] || '').join('').toUpperCase() || 'SG';
    }
    function hostArt(host) {
      const logo = sgSafeHttpUrl(host.logo_url);
      const header = sgSafeHttpUrl(host.header_image_url);
      if (logo) return `<img class="logo" src="${sgEscapeHtml(logo)}" alt="">`;
      if (header) return `<img src="${sgEscapeHtml(header)}" alt="">`;
      return `<span aria-hidden="true">${sgEscapeHtml(initials(host.org_name))}</span>`;
    }
    api('/api/following').then(({ hosts }) => {
      const list = document.getElementById('following-list');
      if (!hosts.length) {
        list.style.display = 'none';
        document.getElementById('following-empty').hidden = false;
        return;
      }
      list.innerHTML = hosts.map(host => {
        const name = sgEscapeHtml(host.org_name);
        const slug = encodeURIComponent(host.public_slug);
        const count = Number(host.upcoming_count) || 0;
        return `<a class="following-card" href="/h/${slug}" aria-label="View ${name} Host Page">
          <div class="following-art">${hostArt(host)}</div>
          <div class="following-copy"><h2>${name}</h2><p class="following-count">${count} upcoming ${count === 1 ? 'show' : 'shows'}</p><span class="following-link">View page →</span></div>
        </a>`;
      }).join('');
    }).catch(err => {
      document.getElementById('following-list').innerHTML = `<p class="following-loading">${sgEscapeHtml(err.message)}</p>`;
    });
  </script>
</body>
</html>

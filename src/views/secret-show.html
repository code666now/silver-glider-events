<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Secret Show — Silver Glider Events</title>
  <link rel="stylesheet" href="/css/brand.css">
  <style>
    body {
      min-height: 100svh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 32%, rgba(28,197,190,.08), transparent 26%),
        radial-gradient(circle at 74% 78%, rgba(136,91,46,.08), transparent 30%),
        #090a0a;
    }
    .secret-atmosphere,.secret-atmosphere::before,.secret-atmosphere::after {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .secret-atmosphere { overflow:hidden; }
    .secret-atmosphere::before {
      content:'';
      inset:50% auto auto 50%;
      width:min(72vw,680px);height:min(72vw,680px);
      border:1px solid rgba(255,255,255,.045);border-radius:50%;
      box-shadow:0 0 0 70px rgba(255,255,255,.012),0 0 120px rgba(28,197,190,.035);
      transform:translate(-50%,-50%);
      animation:secret-breathe 8s ease-in-out infinite alternate;
    }
    .secret-atmosphere::after {
      content:'';
      opacity:.035;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    }
    .secret-shell {
      position:relative;z-index:1;
      width:min(100%,620px);min-height:100svh;margin:0 auto;
      display:flex;flex-direction:column;justify-content:center;align-items:center;
      padding:max(42px,env(safe-area-inset-top)) 24px max(30px,env(safe-area-inset-bottom));
      text-align:center;
    }
    .secret-logo { width:48px;height:48px;object-fit:contain;margin-bottom:30px;filter:grayscale(.18); }
    .secret-brand { color:#747579;margin-bottom:28px; }
    h1 { font-size:clamp(48px,12vw,76px);letter-spacing:.04em;margin-bottom:18px; }
    .secret-copy { color:#9b9ca0;font-size:clamp(16px,4vw,19px);line-height:1.7;margin-bottom:42px; }
    .secret-copy strong { display:block;color:#d7d7d9;font-weight:500; }
    .secret-form { width:min(100%,500px); }
    .code-entry {
      position:relative;display:grid;grid-template-columns:repeat(6,minmax(38px,1fr));gap:10px;
      width:100%;cursor:text;
    }
    .code-input {
      position:absolute;inset:0;width:100%;height:100%;z-index:2;
      opacity:.01;border:0;background:transparent;color:transparent;caret-color:transparent;
      font-size:16px;
    }
    .code-slot {
      display:grid;place-items:center;aspect-ratio:1/1;
      border:1px solid rgba(255,255,255,.13);border-radius:50%;
      background:rgba(255,255,255,.018);color:#ececee;
      font:700 clamp(17px,5vw,24px) var(--sg-font-display);
      text-transform:uppercase;transition:border-color .16s ease,background .16s ease,transform .16s ease;
    }
    .code-slot.filled { border-color:rgba(28,197,190,.42);background:rgba(28,197,190,.055); }
    .code-slot.active { border-color:var(--sg-accent);transform:scale(1.035); }
    .secret-error { min-height:24px;margin:17px 0 8px;color:#d98a8a;font-size:12px;font-weight:600; }
    .secret-submit { margin-top:10px;padding:16px 32px;letter-spacing:.12em;font-size:13px; }
    .secret-micro { margin-top:20px;color:#4f5054;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase; }
    .secret-legal { margin-top:54px;display:flex;gap:10px;color:#3e3f42;font-size:9px; }
    .secret-legal a { color:#55565a; }
    body.unlocking .secret-shell { animation:secret-open .65s ease forwards; }
    body.unlocking .secret-atmosphere::before { animation:secret-vault .65s ease forwards; }
    @keyframes secret-breathe { from{opacity:.45;transform:translate(-50%,-50%) scale(.97)} to{opacity:1;transform:translate(-50%,-50%) scale(1.03)} }
    @keyframes secret-open { to{opacity:0;transform:scale(1.025);filter:blur(6px)} }
    @keyframes secret-vault { to{opacity:0;transform:translate(-50%,-50%) scale(1.3)} }
    @media(max-width:420px) {
      .secret-shell { padding-left:18px;padding-right:18px; }
      .code-entry { gap:7px; }
    }
    @media(prefers-reduced-motion:reduce) {
      .secret-atmosphere::before,body.unlocking .secret-shell,body.unlocking .secret-atmosphere::before { animation:none; }
      .code-slot { transition:none; }
    }
  </style>
</head>
<body>
  <div class="secret-atmosphere" aria-hidden="true"></div>
  <main class="secret-shell">
    <img class="secret-logo" src="/logo.png" alt="">
    <p class="sg-label secret-brand">Silver Glider Events</p>
    <h1>SECRET SHOW</h1>
    <p class="secret-copy"><strong>You have the link.</strong>Now enter the code.</p>

    <form class="secret-form" id="secret-form" novalidate>
      <div class="code-entry" id="code-entry">
        <input class="code-input" id="secret-code" name="code" type="text" inputmode="text" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="6" aria-label="Six-character access code" aria-describedby="secret-error secret-help">
        <span class="code-slot" aria-hidden="true"></span><span class="code-slot" aria-hidden="true"></span><span class="code-slot" aria-hidden="true"></span><span class="code-slot" aria-hidden="true"></span><span class="code-slot" aria-hidden="true"></span><span class="code-slot" aria-hidden="true"></span>
      </div>
      <p class="secret-error" id="secret-error" role="alert" aria-live="polite"></p>
      <button class="sg-btn sg-btn-primary sg-btn-block secret-submit" id="secret-submit" type="submit" disabled>UNLOCK EVENT</button>
      <p class="secret-micro" id="secret-help">Only those with the code get in.</p>
    </form>

    <footer class="secret-legal"><a href="/privacy">Privacy Policy</a><span aria-hidden="true">·</span><a href="/terms">Terms</a></footer>
  </main>
  <script src="/js/secret-show.js"></script>
</body>
</html>

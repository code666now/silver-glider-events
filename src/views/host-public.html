<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0E0E0E">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>{{HOST_NAME}} events | Silver Glider</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <meta property="og:title" content="{{HOST_NAME}} events">
  <meta property="og:description" content="{{META_DESCRIPTION}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:url" content="{{OG_URL}}">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/css/follow-flow.css">
  <script src="/js/legal-footer.js" defer></script>
  <style>
    html,body { overflow-x:hidden; }
    body { background:#0e0e0e; }
    .host-page { min-height:100vh;background:radial-gradient(70% 45% at 50% 0,rgba(28,197,190,.08),transparent 72%); }
    .host-hero {
      position:relative;width:100%;height:clamp(270px,43vw,520px);overflow:hidden;
      background:
        radial-gradient(80% 100% at 10% 15%,rgba(28,197,190,.52),transparent 58%),
        radial-gradient(75% 95% at 90% 35%,rgba(255,138,42,.42),transparent 60%),
        linear-gradient(135deg,#142c2c 0%,#161616 48%,#3a2114 100%);
    }
    .host-hero::after { content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,5,.12),transparent 45%,rgba(14,14,14,.82) 100%); }
    .host-hero-image { width:100%;height:100%;display:block;object-fit:cover;object-position:center; }
    .host-brand { position:absolute;z-index:2;top:28px;left:max(24px,calc((100% - 1080px)/2));color:rgba(255,255,255,.72);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.22em;text-shadow:0 1px 8px rgba(0,0,0,.6); }
    @media (hover: hover) { .host-brand:hover { color:#fff; } }
    .host-owner-dashboard {
      position:absolute;z-index:3;top:22px;right:clamp(24px,2vw,40px);display:inline-flex;align-items:center;justify-content:center;
      min-height:44px;padding:8px 14px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(10,10,10,.58);
      color:rgba(255,255,255,.78);font-size:11px;font-weight:700;letter-spacing:.02em;box-shadow:0 8px 24px rgba(0,0,0,.16);
      -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:color .16s ease,border-color .16s ease,background .16s ease,transform .16s ease;
    }
    @media (hover: hover) { .host-owner-dashboard:hover { color:#fff;border-color:rgba(255,255,255,.28);background:rgba(10,10,10,.74);transform:translateY(-1px); } }
    .host-shell { width:min(100% - 40px,1080px);margin:0 auto;padding:0 0 84px; }
    .host-identity { position:relative;z-index:3;display:flex;align-items:flex-end;gap:24px;margin-top:-54px;margin-bottom:58px; }
    .host-avatar {
      width:112px;height:112px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(255,255,255,.16);border-radius:28px;background:#131313;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden;
    }
    .host-avatar img { width:100%;height:100%;display:block;object-fit:contain;padding:9px; }
    .host-initials { color:var(--sg-accent);font-family:var(--sg-font-display);font-size:32px;font-weight:700;letter-spacing:.04em; }
    .host-copy { min-width:0;padding-bottom:4px; }
    .host-eyebrow { margin-bottom:7px;color:var(--sg-text-faint);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.19em; }
    .host-copy h1 { font-size:clamp(38px,6.5vw,68px);line-height:.98;overflow-wrap:anywhere; }
    .host-bio { max-width:650px;margin-top:15px;color:var(--sg-text-dim);font-size:16px;line-height:1.65;white-space:pre-line; }
    .host-links { display:flex;align-items:center;gap:10px;margin-top:17px; }
    .host-link {
      width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--sg-border);
      border-radius:50%;color:var(--sg-text-dim);background:rgba(17,17,17,.64);transition:color .16s ease,border-color .16s ease,transform .16s ease;
    }
    @media (hover: hover) { .host-link:hover { color:var(--sg-accent);border-color:rgba(28,197,190,.4);transform:translateY(-1px); } }
    .host-link svg { width:18px;height:18px; }
    .host-follow { display:flex;align-items:center;gap:14px;margin-top:20px; }
    .host-follow-button { min-height:46px;padding:11px 21px;border:1px solid var(--sg-accent);border-radius:999px;background:var(--sg-accent);color:#080808;font:800 13px var(--sg-font-body);cursor:pointer;transition:transform .16s ease,background .16s ease,color .16s ease; }
    @media (hover: hover) { .host-follow-button:hover { transform:translateY(-1px);background:var(--sg-accent-press); } }
    .host-follow-button.following { background:rgba(28,197,190,.1);color:var(--sg-accent); }
    .host-follow-button:disabled { cursor:wait;opacity:.62;transform:none; }
    .host-follow p { max-width:360px;color:var(--sg-text-dim);font-size:13px;font-weight:600;line-height:1.5; }
    .host-section + .host-section { margin-top:72px; }
    .host-section-head { display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px; }
    .host-section-title { font-size:clamp(25px,4vw,34px); }
    .host-event-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px; }
    .host-event-grid.past { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .host-event-card { display:flex;min-width:0;flex-direction:column;color:var(--sg-text);background:rgba(17,17,17,.82);border:1px solid var(--sg-border-soft);border-radius:22px;overflow:hidden;transition:transform .16s ease,border-color .16s ease; }
    @media (hover: hover) { .host-event-card:hover { transform:translateY(-2px);border-color:rgba(28,197,190,.4); } }
    .host-event-art { aspect-ratio:16/9;background:var(--sg-surface);overflow:hidden; }
    .host-event-art img,.host-event-placeholder { display:block;width:100%;height:100%;object-fit:cover; }
    .host-event-copy { display:flex;flex:1;flex-direction:column;padding:20px 20px 21px; }
    .host-event-date { color:var(--sg-accent);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px; }
    .host-event-copy h3 { font-size:24px;line-height:1.15;margin-bottom:10px;overflow-wrap:anywhere; }
    .host-event-location { color:var(--sg-text-dim);font-size:13px;line-height:1.45; }
    .host-event-cta { display:inline-flex;align-items:center;gap:5px;margin-top:20px;color:var(--sg-text);font-size:12px;font-weight:700; }
    @media (hover: hover) { .host-event-card:hover .host-event-cta { color:var(--sg-accent); } }
    .host-event-card.past .host-event-copy { padding:17px 18px 19px; }
    .host-event-card.past .host-event-copy h3 { font-size:20px; }
    .host-event-card.past .host-event-cta { margin-top:16px; }
    .host-empty { grid-column:1/-1;padding:44px 28px;border:1px solid var(--sg-border-soft);border-radius:22px;background:rgba(17,17,17,.55);text-align:center;color:var(--sg-text-dim);font-size:14px; }
    .host-footer { margin-top:76px;padding-top:24px;border-top:1px solid var(--sg-border-soft);font-size:12px;color:var(--sg-text-faint); }
    .host-footer a { min-height:44px;display:inline-flex;align-items:center;color:var(--sg-text-dim);font-weight:700; }
    @media(max-width:850px) {
      .host-event-grid.past { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media(max-width:680px) {
      .host-hero { height:290px; }
      .host-brand { top:22px;left:20px; }
      .host-owner-dashboard { top:15px;right:16px;min-height:44px;padding:7px 12px; }
      .host-shell { width:min(100% - 32px,1080px); }
      .host-identity { align-items:center;flex-direction:column;margin-top:-48px;margin-bottom:50px;gap:17px;text-align:center; }
      .host-avatar { width:96px;height:96px;border-radius:24px; }
      .host-copy { padding:0; }
      .host-bio { margin:13px auto 0;font-size:15px; }
      .host-links { justify-content:center; }
      .host-follow { align-items:center;flex-direction:column; }
      .host-follow p { max-width:310px; }
      .host-event-grid,.host-event-grid.past { grid-template-columns:1fr; }
      .host-section + .host-section { margin-top:58px; }
      .host-footer { text-align:center; }
    }
  </style>
</head>
<body>
  <main class="host-page">
    <section class="host-hero" aria-label="{{HOST_NAME}} header">
      {{HOST_HEADER}}
      <a class="host-brand" href="/">Silver Glider Events</a>
      {{OWNER_NAV}}
    </section>

    <div class="host-shell">
      <header class="host-identity">
        {{HOST_AVATAR}}
        <div class="host-copy">
          <p class="host-eyebrow">Events presented by</p>
          <h1>{{HOST_NAME}}</h1>
          {{HOST_BIO}}
          {{HOST_LINKS}}
          {{HOST_FOLLOW}}
        </div>
      </header>

      <section class="host-section" aria-labelledby="upcoming-title">
        <div class="host-section-head"><h2 class="host-section-title" id="upcoming-title">Upcoming Events</h2></div>
        <div class="host-event-grid">{{UPCOMING_EVENT_CARDS}}</div>
      </section>

      <section class="host-section" aria-labelledby="past-title">
        <div class="host-section-head"><h2 class="host-section-title" id="past-title">Past Events</h2></div>
        <div class="host-event-grid past">{{PAST_EVENT_CARDS}}</div>
      </section>

      <footer class="host-footer">Powered by <a href="/">Silver Glider</a></footer>
    </div>
  </main>
  <script src="/js/email-code-input.js"></script>
  <script src="/js/follow-flow.js"></script>
  <script>
    (() => {
      if (!window.SGFollowFlow) return;
      const root = document.querySelector('[data-host-follow]');
      if (!root) return;
      const button = root.querySelector('[data-follow-button]');
      const summary = root.querySelector('[data-follow-summary]');
      const controller = window.SGFollowFlow.mount({
        hostSlug: root.dataset.hostSlug,
        hostName: root.dataset.hostName,
        trigger: button,
        onChange(state) {
          root.dataset.following = String(Boolean(state.following));
          root.dataset.emailOn = String(Boolean(state.emailOn));
          root.dataset.textOn = String(Boolean(state.textOn));
          button.classList.toggle('following', Boolean(state.following));
          button.setAttribute('aria-pressed', String(Boolean(state.following)));
          button.textContent = state.following ? 'Following ✓' : 'Follow';
          summary.textContent = state.following
            ? `Following · Email ${state.emailOn ? 'on' : 'off'} · Text ${state.textOn ? 'on' : 'off'}`
            : 'Choose email, text, or both';
        }
      });
      const params = new URLSearchParams(location.search);
      if (params.get('follow') === '1' || params.get('followed') === '1') {
        params.delete('follow');params.delete('followed');
        const query = params.toString();
        history.replaceState({}, '', `${location.pathname}${query ? `?${query}` : ''}${location.hash}`);
        controller.open();
      }
    })();
  </script>
</body>
</html>

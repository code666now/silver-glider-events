<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Silver Glider Events</title>
  <link rel="stylesheet" href="/css/brand.css">
  <script src="/js/legal-footer.js" defer></script>
</head>
<body>
  <div class="sg-aurora" aria-hidden="true"></div>
  <div class="sg-aurora-veil" aria-hidden="true"></div>
  <main style="max-width:400px;margin:0 auto;padding:12vh 24px 0">
    <p class="sg-label" style="margin-bottom:28px">Silver Glider Events</p>

    <div id="form-state">
      <h1 style="font-size:34px;margin-bottom:10px">Sign in</h1>
      <p style="color:var(--sg-text-dim);font-size:15px;margin-bottom:32px">Enter your email and we'll send you a sign-in code. No password needed.</p>
      <p id="error" style="display:none;color:var(--sg-danger);font-size:14px;margin-bottom:18px"></p>
      <div id="returning-guest" hidden style="padding:22px;border:1px solid var(--sg-border);border-radius:18px;background:rgba(255,255,255,.035);margin-bottom:18px">
        <p class="sg-label" style="margin-bottom:8px">Welcome back</p>
        <h2 id="returning-title" style="font-size:24px;margin-bottom:8px"></h2>
        <p id="returning-email" style="color:var(--sg-text-dim);font-size:14px;margin-bottom:18px"></p>
        <button class="sg-btn sg-btn-primary sg-btn-block" type="button" id="continue-guest">Email my sign-in link</button>
        <button class="sg-btn sg-btn-ghost sg-btn-block" type="button" id="different-email" style="margin-top:10px">Use a different email</button>
      </div>
      <form id="login-form">
        <div class="sg-field">
          <label for="email">Email</label>
          <input class="sg-input" type="email" id="email" name="email" autocomplete="email" required autofocus placeholder="you@example.com">
        </div>
        <button class="sg-btn sg-btn-primary sg-btn-block" type="submit" id="submit-btn">Continue</button>
      </form>
    </div>

    <!-- Luma-style: finish right here with the emailed code, or tap the link
         in the email on any device. The code only works in this browser. -->
    <div id="sent-state" style="display:none">
      <h1 style="font-size:34px;margin-bottom:10px">Check your email</h1>
      <p style="color:var(--sg-text-dim);font-size:15px;line-height:1.7;margin-bottom:22px">Enter the 6-digit code we sent to <strong id="sent-email" style="color:var(--sg-text)"></strong>, or tap the link in that email.</p>
      <form id="code-form" class="sg-code-row" novalidate>
        <input class="sg-input sg-code-input" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" aria-label="6-digit code" placeholder="000000">
        <button class="sg-btn sg-btn-primary" type="submit" id="code-submit">Sign in</button>
      </form>
      <p class="sg-code-error" id="code-error" role="alert"></p>
      <div class="sg-code-actions" style="margin-top:22px">
        <button class="sg-code-link" type="button" id="resend-code" disabled>Send a new code</button>
        <a class="sg-code-link" href="/login">Use a different email</a>
      </div>
      <p style="color:var(--sg-text-faint);font-size:13px;margin-top:18px">The code and link expire in 15 minutes.</p>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const requestedNext = params.get('next') || '';
    const next = requestedNext.startsWith('/') && !requestedNext.startsWith('//') ? requestedNext : '';
    let returningGuest = null;
    let lastRequest = null;
    const form = document.getElementById('login-form');
    const returningPanel = document.getElementById('returning-guest');
    const codeInput = document.getElementById('code');
    const codeSubmit = document.getElementById('code-submit');
    const codeError = document.getElementById('code-error');
    const resendButton = document.getElementById('resend-code');
    if (params.get('error') === 'expired') {
      const err = document.getElementById('error');
      err.textContent = 'That link expired or was already used. Request a new one.';
      err.style.display = 'block';
    }

    function showCodeError(message) {
      codeError.textContent = message || '';
      codeError.style.display = message ? 'block' : 'none';
    }

    function enableResendSoon() {
      resendButton.disabled = true;
      setTimeout(() => { resendButton.disabled = false; }, 30000);
    }

    async function showSent(emailLabel) {
      document.getElementById('form-state').style.display = 'none';
      document.getElementById('sent-email').textContent = emailLabel;
      document.getElementById('sent-state').style.display = 'block';
      codeInput.focus();
      enableResendSoon();
    }

    async function requestSignIn(url, body) {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || 'Something went wrong. Try again.');
      lastRequest = { url, body };
    }

    let verifying = false;
    async function verifyCode() {
      const code = codeInput.value.replace(/\D/g, '');
      if (verifying || code.length !== 6) return;
      verifying = true;
      codeSubmit.disabled = true;
      codeSubmit.textContent = 'Checking…';
      showCodeError('');
      try {
        const response = await fetch('/api/auth/verify-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || 'That code didn’t work.');
        location.href = data.redirect || next || '/dashboard';
      } catch (error) {
        showCodeError(error.message);
        codeInput.select();
        codeSubmit.disabled = false;
        codeSubmit.textContent = 'Sign in';
      } finally {
        verifying = false;
      }
    }

    codeInput.addEventListener('input', () => {
      codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6);
      if (codeInput.value.length === 6) verifyCode();
    });
    document.getElementById('code-form').addEventListener('submit', event => {
      event.preventDefault();
      verifyCode();
    });
    resendButton.addEventListener('click', async () => {
      if (!lastRequest) return;
      resendButton.disabled = true;
      showCodeError('');
      try {
        await requestSignIn(lastRequest.url, lastRequest.body);
        codeInput.value = '';
        codeInput.focus();
        showCodeError('');
        enableResendSoon();
      } catch (error) {
        showCodeError(error.message);
        resendButton.disabled = false;
      }
    });

    fetch('/api/public/guest-session', { headers: { Accept: 'application/json' } })
      .then(response => response.ok ? response.json() : null)
      .then(guest => {
        if (!guest?.recognized) return;
        returningGuest = guest;
        document.getElementById('returning-title').textContent = `Continue as ${guest.firstName}`;
        document.getElementById('returning-email').textContent = guest.maskedEmail;
        returningPanel.hidden = false;
        form.hidden = true;
      }).catch(() => {});
    document.getElementById('different-email').addEventListener('click', async () => {
      await fetch('/api/public/guest-session/forget', { method: 'POST' }).catch(() => {});
      returningGuest = null;
      returningPanel.hidden = true;
      form.hidden = false;
      document.getElementById('email').focus();
    });
    document.getElementById('continue-guest').addEventListener('click', async () => {
      const button = document.getElementById('continue-guest');
      button.disabled = true;
      button.textContent = 'Sending…';
      try {
        await requestSignIn('/api/auth/guest-magic-link', { next });
        showSent(returningGuest.maskedEmail);
      } catch (error) {
        const el = document.getElementById('error');
        el.textContent = error.message;
        el.style.display = 'block';
        button.disabled = false;
        button.textContent = 'Email my sign-in link';
      }
    });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const email = document.getElementById('email').value.trim();
      btn.disabled = true;
      btn.textContent = 'Sending…';
      try {
        await requestSignIn('/api/auth/magic-link', { email, next });
        showSent(email);
      } catch (err) {
        const el = document.getElementById('error');
        el.textContent = err.message;
        el.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Continue';
      }
    });
  </script>
</body>
</html>

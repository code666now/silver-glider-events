<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E0E">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>My Events — Silver Glider Events</title>
  <link rel="stylesheet" href="/css/brand.css">
  <script src="/js/legal-footer.js" defer></script>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    /* Swipe-to-archive rows */
    .swipe-row {
      position: relative;
      overflow: hidden;
      border-radius: var(--sg-radius-card);
      margin-bottom: 14px;
    }
    .swipe-row .sg-event-card {
      margin-bottom: 0;
      position: relative;
      z-index: 1;
      transition: transform .22s cubic-bezier(.2,.8,.2,1);
      touch-action: pan-y;            /* let vertical scroll through, capture horizontal drag */
      -webkit-user-select: none; user-select: none;
    }
    .swipe-row.dragging .sg-event-card { transition: none; }
    .swipe-row.open .sg-event-card,
    .swipe-row:focus-within .sg-event-card { transform: translateX(-104px); }
    .swipe-action {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 104px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(28, 197, 190, 0.18);
      border: 1px solid rgba(28, 197, 190, 0.35);
      border-radius: var(--sg-radius-card);
    }
    .swipe-arch-btn {
      background: none; border: none; color: var(--sg-accent);
      font-family: var(--sg-font-body); font-weight: 700; font-size: 14px;
      width: 100%; height: 100%; cursor: pointer;
    }
    .swipe-arch-btn:focus-visible { outline:2px solid var(--sg-accent);outline-offset:-4px; }

    /* Collapsible section headers */
    .section-toggle {
      display: flex; align-items: center; gap: 8px;
      background: none; border: none; cursor: pointer; padding: 0;
      margin-bottom: 14px;
    }
    .section-toggle .chev { color: var(--sg-accent); font-size: 12px; transition: transform .15s ease; display: inline-block; }
    .section-toggle.open .chev { transform: rotate(90deg); }

    .archive-hint { color: var(--sg-text-faint); font-size: 12px; margin: 6px 0 0; }
    .sg-event-thumb.flyer { object-fit:contain;background:#090909; }
    .events-grid { display:none; }
    .events-grid.visible { display:block; }
    .events-loading[hidden] { display:none; }
    .events-skeleton-grid { display:grid;gap:14px; }
    .events-skeleton-card {
      display:flex;align-items:center;gap:16px;min-height:118px;padding:16px;
      border:1px solid var(--sg-border-soft);border-radius:var(--sg-radius-card);
      background:var(--sg-card);
    }
    .events-skeleton-thumb { width:84px;height:84px;flex:0 0 auto;border-radius:16px; }
    .events-skeleton-copy { min-width:0;flex:1;display:grid;gap:10px; }
    .events-skeleton-title { width:min(240px,72%);height:18px; }
    .events-skeleton-meta { width:min(310px,88%);height:12px; }
    .events-skeleton-count { width:44px;height:32px;flex:0 0 auto; }
    .events-load-error { padding:64px 24px;text-align:center;color:var(--sg-text-dim); }
    .events-load-error h2 { margin-bottom:8px;font-size:22px;color:var(--sg-text); }
    .events-load-error p { margin-bottom:22px;font-size:14px; }
    .events-tabs { display:flex;gap:5px;width:min(360px,100%);margin:0 0 30px;padding:5px;border:1px solid var(--sg-border-soft);border-radius:999px;background:rgba(255,255,255,.025); }
    .events-tab { flex:1;min-height:42px;padding:9px 18px;border:0;border-radius:999px;background:transparent;color:var(--sg-text-dim);font:800 13px var(--sg-font-body);cursor:pointer; }
    .events-tab[aria-selected="true"] { background:rgba(28,197,190,.14);color:var(--sg-accent);box-shadow:inset 0 0 0 1px rgba(28,197,190,.22); }
    .events-tab:focus-visible { outline:2px solid var(--sg-accent);outline-offset:3px; }
    #empty-action[hidden] { display:none !important; }
    .going-card .sg-event-count strong { color:var(--sg-accent);font-size:15px; }
    .going-card .sg-event-count span { font-size:11px; }

    /* Toast with an action button */
    .sg-toast .toast-action {
      background: none; border: none; color: var(--sg-accent);
      font-family: var(--sg-font-body); font-weight: 800; font-size: 14px;
      margin-left: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: .06em;
      pointer-events:none;
    }
    .sg-toast.show .toast-action { pointer-events:auto; }
    .sg-toast .toast-action:focus-visible { outline:2px solid var(--sg-accent);outline-offset:3px;border-radius:8px; }
    @media (min-width:1024px) {
      .events-shell {
        max-width:1260px;
        padding-right:32px;
        padding-left:32px;
        padding-bottom:96px;
      }
      .events-shell .sg-nav { margin-bottom:42px; }
      .events-header { margin-bottom:32px !important; }
      .events-grid.visible {
        display:grid;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:14px;
      }
      .events-skeleton-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .events-skeleton-card { min-height:122px;padding:18px; }
      .events-skeleton-thumb { width:92px;height:92px; }
      .events-grid .swipe-row { height:100%;margin-bottom:0; }
      .events-grid .sg-event-card { min-height:122px;height:100%;padding:18px; }
      .events-grid .sg-event-thumb { width:92px;height:92px; }
      .events-grid .sg-event-meta h3 { font-size:20px; }
      .events-grid .sg-event-count { min-width:54px; }
      .events-grid .sg-event-count strong { font-size:26px; }
      .events-shell .sg-empty {
        min-height:470px;
        display:grid;
        place-items:center;
        border:1px dashed rgba(28,197,190,.24);
        border-radius:24px;
        background:linear-gradient(145deg,rgba(28,197,190,.045),rgba(255,255,255,.012));
      }
      .events-shell .sg-empty[style*="display:none"] { display:none; }
    }
    @media (max-width:879px) {
      .events-header {
        display:block !important;
        margin-bottom:24px !important;
      }
      .events-header .sg-page-title {
        overflow-wrap:anywhere;
      }
      .events-tabs {
        width:100%;
        min-height:62px;
        gap:6px;
        margin-bottom:28px;
        padding:5px;
        border-radius:20px;
      }
      .events-tab {
        min-height:50px;
        padding:12px 16px;
        font-size:14px;
      }
      .events-skeleton-grid {
        gap:16px;
      }
      .events-skeleton-card {
        min-height:116px;
        gap:14px;
        padding:16px;
        border-radius:var(--sg-mobile-card-radius);
      }
      .events-skeleton-thumb {
        width:76px;
        height:76px;
        border-radius:18px;
      }
      .events-skeleton-title {
        height:19px;
      }
      .swipe-row {
        border-radius:var(--sg-mobile-card-radius);
        margin-bottom:16px;
      }
      .swipe-action {
        border-radius:var(--sg-mobile-card-radius);
      }
      .swipe-arch-btn {
        min-width:44px;
        min-height:44px;
        font-size:14px;
      }
      .events-grid .sg-event-card {
        min-height:116px;
      }
      .events-grid .sg-event-meta h3 {
        font-size:18px;
      }
      .events-grid .sg-event-count {
        min-width:46px;
      }
      .going-card .sg-event-count strong {
        font-size:15px;
      }
      .going-card .sg-event-count span {
        font-size:11px;
      }
      .section-toggle {
        width:100%;
        min-height:48px;
        margin-bottom:12px;
        padding:2px 0;
        text-align:left;
      }
      .section-toggle .chev {
        width:20px;
        font-size:13px;
        text-align:center;
      }
      .archive-hint {
        margin-top:10px;
        font-size:13px;
        line-height:1.55;
      }
      .restore-btn {
        min-width:82px;
        min-height:48px;
        padding:10px 14px !important;
        font-size:13px !important;
      }
      .events-load-error {
        padding:52px 20px;
      }
      .events-load-error h2 {
        font-size:var(--sg-mobile-section-title-size);
      }
      .events-load-error p {
        font-size:15px;
        line-height:1.6;
      }
      .events-shell .sg-empty {
        min-height:300px;
        padding:72px 22px 42px;
        border:1px dashed rgba(28,197,190,.24);
        border-radius:var(--sg-mobile-card-radius);
        background:linear-gradient(145deg,rgba(28,197,190,.045),rgba(255,255,255,.012));
      }
      .events-shell #empty-action {
        display:none !important;
      }
      .sg-toast .toast-action {
        min-height:44px;
        display:inline-flex;
        align-items:center;
        margin-left:10px;
      }
    }
  </style>
</head>
<body class="has-mobile-sticky-action">
  <div class="sg-shell events-shell">
    <nav id="nav"></nav>
    <div class="events-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:28px">
      <h1 class="sg-page-title" style="margin:0">My Events</h1>
      <a class="sg-btn sg-btn-primary sg-mobile-sticky-action" href="/events/new">Create Event</a>
    </div>

    <div class="events-tabs" role="tablist" aria-label="My events views">
      <button class="events-tab" id="going-tab" type="button" role="tab" aria-controls="events-content" aria-selected="true" data-view="going">Going</button>
      <button class="events-tab" id="hosting-tab" type="button" role="tab" aria-controls="events-content" aria-selected="false" tabindex="-1" data-view="hosting">Hosting</button>
    </div>

    <section class="events-loading" id="events-loading" aria-label="Loading events">
      <p class="sg-label" id="loading-label" style="margin-bottom:14px">Upcoming</p>
      <div class="events-skeleton-grid" aria-hidden="true">
        <div class="events-skeleton-card">
          <span class="sg-skeleton events-skeleton-thumb"></span>
          <span class="events-skeleton-copy"><span class="sg-skeleton events-skeleton-title"></span><span class="sg-skeleton events-skeleton-meta"></span></span>
          <span class="sg-skeleton events-skeleton-count"></span>
        </div>
        <div class="events-skeleton-card">
          <span class="sg-skeleton events-skeleton-thumb"></span>
          <span class="events-skeleton-copy"><span class="sg-skeleton events-skeleton-title"></span><span class="sg-skeleton events-skeleton-meta"></span></span>
          <span class="sg-skeleton events-skeleton-count"></span>
        </div>
      </div>
    </section>

    <div id="events-content" aria-busy="true" role="tabpanel" aria-labelledby="going-tab" tabindex="0">

    <div id="upcoming-section" style="display:none">
      <p class="sg-label" id="upcoming-label" style="margin-bottom:14px">Upcoming</p>
      <div class="events-grid" id="upcoming"></div>
    </div>

    <div id="past-section" style="display:none;margin-top:36px">
      <button class="section-toggle" id="past-toggle" type="button" aria-expanded="false" aria-controls="past">
        <span class="chev">▶</span><span class="sg-label" id="past-label">Past</span>
      </button>
      <div class="events-grid" id="past"></div>
    </div>

    <div id="archived-section" style="display:none;margin-top:36px">
      <button class="section-toggle" id="archived-toggle" type="button" aria-expanded="false" aria-controls="archived">
        <span class="chev">▶</span><span class="sg-label" id="archived-label">Archived</span>
      </button>
      <div class="events-grid" id="archived"></div>
      <p class="archive-hint" id="archive-hint" style="display:none">Archiving hides an event from your list. Guest lists and RSVPs are always kept.</p>
    </div>

    <div id="empty" class="sg-empty" style="display:none">
      <h3 id="empty-title">No events yet</h3>
      <p id="empty-copy">Events you RSVP to will appear here.</p>
      <a class="sg-btn sg-btn-primary" id="empty-action" href="/events/new" hidden>Create Event</a>
    </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/events-view-state.js"></script>
  <script>
    renderNav('events');
    const { normalizeView, resolveInitialView, isUpcomingEventDate } = window.SGEventsViewState;
    const VIEW_KEY = 'sge_events_view';
    const requestedView = new URLSearchParams(location.search).get('view');
    let rememberedView = null;
    try { rememberedView = localStorage.getItem(VIEW_KEY); } catch (_) {}
    const validRequestedView = normalizeView(requestedView);
    const validRememberedView = normalizeView(rememberedView);
    let activeView = resolveInitialView(requestedView, rememberedView);
    // With no explicit or remembered choice, open the tab that has something coming up
    // so a host never lands on an empty Going tab.
    const chooseInitialView = validRequestedView || validRememberedView ? Promise.resolve() : Promise.all([
      api('/api/events/going').catch(() => ({ events: [] })),
      api('/api/events').catch(() => ({ events: [] }))
    ]).then(([going, hosting]) => {
      const hasUpcoming = list => (list || []).some(e => isUpcomingEventDate(e.event_date));
      if (!hasUpcoming(going.events) && (hosting.events || []).length) activeView = 'hosting';
    });
    const eventsLoadingMarkup = document.getElementById('events-loading').innerHTML;
    let userSelectedView = false;
    let loadRequestId = 0;

    // Wrap a card in a swipe-to-archive row
    function swipeWrap(ev, inner) {
      const title = sgEscapeHtml(ev.title || '');
      return `<div class="swipe-row" data-id="${encodeURIComponent(String(ev.id))}" data-title="${title}">
        ${inner}
        <div class="swipe-action"><button class="swipe-arch-btn" type="button" aria-label="Archive ${title}">Archive</button></div>
      </div>`;
    }

    // ── Swipe gesture (Pointer Events: touch swipe + mouse drag) ──
    const OPEN_PX = 104, THRESHOLD = 52;
    let row = null, startX = 0, startY = 0, horizontal = false, tracking = false, justSwiped = false;

    function closeAll(except) {
      document.querySelectorAll('.swipe-row.open').forEach(r => { if (r !== except) r.classList.remove('open'); });
    }
    function cardEl(r) { return r.querySelector('.sg-event-card'); }

    document.addEventListener('pointerdown', e => {
      const r = e.target.closest('.swipe-row');
      if (!r) { closeAll(null); return; }
      row = r; startX = e.clientX; startY = e.clientY; tracking = true; horizontal = false;
    });
    document.addEventListener('pointermove', e => {
      if (!tracking || !row) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (!horizontal) {
        if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { horizontal = true; row.classList.add('dragging'); closeAll(row); }
        else if (Math.abs(dy) > 10) { tracking = false; return; }   // vertical scroll — let it go
      }
      if (horizontal) {
        const base = row.classList.contains('open') ? -OPEN_PX : 0;
        const tx = Math.max(-OPEN_PX, Math.min(0, base + dx));
        cardEl(row).style.transform = `translateX(${tx}px)`;
      }
    });
    document.addEventListener('pointerup', () => {
      if (!row) return;
      const el = cardEl(row);
      row.classList.remove('dragging');
      const m = /translateX\((-?\d+(?:\.\d+)?)px\)/.exec(el.style.transform || '');
      const tx = m ? parseFloat(m[1]) : (row.classList.contains('open') ? -OPEN_PX : 0);
      el.style.transform = '';
      row.classList.toggle('open', tx < -THRESHOLD);
      if (horizontal) { justSwiped = true; setTimeout(() => { justSwiped = false; }, 350); }
      row = null; tracking = false; horizontal = false;
    });

    // Intercept clicks: archive/restore buttons, swallow the click that ends a swipe, close an open row
    document.addEventListener('click', e => {
      const arch = e.target.closest('.swipe-arch-btn');
      if (arch) { e.preventDefault(); handleArchive(arch.closest('.swipe-row')); return; }
      const restore = e.target.closest('.restore-btn');
      if (restore) { e.preventDefault(); handleRestore(restore.dataset.id); return; }
      if (justSwiped) { e.preventDefault(); e.stopPropagation(); return; }
      const c = e.target.closest('.sg-event-card');
      if (c) {
        const r = c.closest('.swipe-row');
        if (r && r.classList.contains('open')) { e.preventDefault(); r.classList.remove('open'); }
      }
    }, true);

    // Toast with an inline action (Undo)
    let _toastActionTimer;
    function toastWithAction(msg, actionLabel, fn) {
      let el = document.querySelector('.sg-toast');
      if (!el) {
        el = document.createElement('div');
        el.className = 'sg-toast';
        document.body.appendChild(el);
      }
      el.setAttribute('role', 'status');
      el.setAttribute('aria-live', 'polite');
      el.setAttribute('aria-atomic', 'true');
      el.innerHTML = '';
      el.append(msg);
      const btn = document.createElement('button');
      btn.className = 'toast-action';
      btn.textContent = actionLabel;
      btn.addEventListener('click', () => { el.classList.remove('show'); fn(); });
      el.appendChild(btn);
      requestAnimationFrame(() => el.classList.add('show'));
      clearTimeout(_toastActionTimer);
      _toastActionTimer = setTimeout(() => el.classList.remove('show'), 6000);
    }

    // Archive is reversible — no confirm; offer Undo instead
    async function handleArchive(r) {
      if (!r) return;
      const id = r.dataset.id;
      try {
        await api(`/api/events/${id}/archive`, { method: 'POST' });
        r.style.height = r.offsetHeight + 'px';
        r.style.transition = 'height .2s ease, opacity .2s ease, margin .2s ease';
        requestAnimationFrame(() => { r.style.height = '0'; r.style.opacity = '0'; r.style.marginBottom = '0'; });
        setTimeout(() => { r.remove(); refreshSections(); }, 210);
        toastWithAction('Event archived', 'Undo', async () => {
          try { await api(`/api/events/${id}/unarchive`, { method: 'POST' }); load(); }
          catch (err) { toast(err.message); }
        });
      } catch (err) {
        toast(err.message);
        r.classList.remove('open');
      }
    }

    async function handleRestore(id) {
      try {
        await api(`/api/events/${id}/unarchive`, { method: 'POST' });
        toast('Event restored');
        load();
      } catch (err) { toast(err.message); }
    }

    function refreshSections() {
      const up = document.getElementById('upcoming');
      const pa = document.getElementById('past');
      if (!up.children.length) document.getElementById('upcoming-section').style.display = 'none';
      if (!pa.children.length) document.getElementById('past-section').style.display = 'none';
      else document.getElementById('past-label').textContent = `Past (${pa.children.length})`;
      const archivedVisible = activeView === 'hosting' && document.getElementById('archived-section').style.display !== 'none';
      if (!up.children.length && !pa.children.length && !archivedVisible) {
        document.getElementById('empty').style.display = 'block';
      }
    }

    function card(ev, mode = 'hosting') {
      const dateStr = new Date(ev.event_date).toLocaleDateString('en-US',
        { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
      const title = String(ev.title || 'Untitled event');
      const flyerMode = ev.presentation_mode === 'flyer';
      const coverUrl = flyerMode
        ? sgSafeHttpUrl(ev.flyer_image_url)
        : sgSafeHttpUrl(ev.cover_image_url);
      const rsvpCount = Number(ev.rsvp_count) || 0;
      const capacity = Number(ev.capacity) || 0;
      const badges = [
        ev.status === 'cancelled' ? '<span class="sg-badge sg-badge-danger">Cancelled</span>' : '',
        ev.status === 'draft' ? '<span class="sg-badge">Draft</span>' : '',
        ev.secret_show_enabled
          ? '<span class="sg-badge">Secret Show</span>'
          : ev.visibility === 'private' ? '<span class="sg-badge">Private</span>' : ''
      ].filter(Boolean).join(' ');
      const going = mode === 'going';
      const hostName = String(ev.host_name || ev.host_person_name || 'Silver Glider host');
      return `
        <a class="sg-event-card${going ? ' going-card' : ''}" href="${going ? `/e/${encodeURIComponent(String(ev.slug))}` : `/events/${encodeURIComponent(String(ev.id))}/manage`}">
          ${coverUrl
            ? `<img class="sg-event-thumb${flyerMode ? ' flyer' : ''}" src="${sgEscapeHtml(coverUrl)}" alt="">`
            : `<div class="sg-event-thumb placeholder">${sgEscapeHtml(title.charAt(0).toUpperCase())}</div>`}
          <div class="sg-event-meta">
            <h3>${sgEscapeHtml(title)}</h3>
            <p>${sgEscapeHtml(dateStr)} · ${sgEscapeHtml(ev.venue_name || '')}</p>
            ${going ? `<p style="margin-top:6px">Hosted by ${sgEscapeHtml(hostName)}</p>` : ''}
            ${badges ? `<p style="margin-top:6px">${badges}</p>` : ''}
          </div>
          <div class="sg-event-count">
            ${going ? '<strong>Going</strong><span>View event</span>' : `<strong>${rsvpCount}</strong><span>going${capacity ? ` / ${capacity}` : ''}</span>`}
          </div>
        </a>`;
    }

    function archivedCard(ev) {
      const dateStr = new Date(ev.event_date).toLocaleDateString('en-US',
        { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
      const title = String(ev.title || 'Untitled event');
      const flyerMode = ev.presentation_mode === 'flyer';
      const coverUrl = flyerMode
        ? sgSafeHttpUrl(ev.flyer_image_url)
        : sgSafeHttpUrl(ev.cover_image_url);
      const rsvpCount = Number(ev.rsvp_count) || 0;
      return `
        <div class="sg-event-card" style="opacity:.75">
          ${coverUrl
            ? `<img class="sg-event-thumb${flyerMode ? ' flyer' : ''}" src="${sgEscapeHtml(coverUrl)}" alt="">`
            : `<div class="sg-event-thumb placeholder">${sgEscapeHtml(title.charAt(0).toUpperCase())}</div>`}
          <div class="sg-event-meta">
            <h3>${sgEscapeHtml(title)}</h3>
            <p>${sgEscapeHtml(dateStr)} · ${rsvpCount} RSVP${rsvpCount === 1 ? '' : 's'} kept</p>
          </div>
          <button class="sg-btn sg-btn-ghost restore-btn" data-id="${encodeURIComponent(String(ev.id))}" style="padding:8px 18px;font-size:13px;flex-shrink:0">Restore</button>
        </div>`;
    }

    function wireToggle(btnId, panelId) {
      const btn = document.getElementById(btnId);
      btn.addEventListener('click', () => {
        const panel = document.getElementById(panelId);
        const open = panel.classList.contains('visible');
        panel.classList.toggle('visible', !open);
        btn.classList.toggle('open', !open);
        btn.setAttribute('aria-expanded', String(!open));
        if (panelId === 'archived') document.getElementById('archive-hint').style.display = open ? 'none' : 'block';
      });
    }
    wireToggle('past-toggle', 'past');
    wireToggle('archived-toggle', 'archived');

    function applyViewState() {
      document.querySelectorAll('.events-tab').forEach(tab => {
        const selected = tab.dataset.view === activeView;
        tab.setAttribute('aria-selected', String(selected));
        tab.tabIndex = selected ? 0 : -1;
      });
      document.getElementById('events-content').setAttribute('aria-labelledby', `${activeView}-tab`);
      document.getElementById('archived-section').style.display = 'none';
      document.getElementById('empty-action').hidden = activeView !== 'hosting';
      document.getElementById('empty-copy').textContent = activeView === 'hosting'
        ? 'Create your first event in under a minute.'
        : 'Events you RSVP to will appear here.';
      history.replaceState(null, '', activeView === 'hosting' ? '/events?view=hosting' : '/events');
    }

    async function load() {
      const requestedLoadView = activeView;
      const requestId = ++loadRequestId;
      const loading = document.getElementById('events-loading');
      const content = document.getElementById('events-content');
      applyViewState();
      loading.hidden = false;
      loading.setAttribute('aria-label', 'Loading events');
      loading.innerHTML = eventsLoadingMarkup;
      content.setAttribute('aria-busy', 'true');
      try {
        const [{ events }, archivedResult] = requestedLoadView === 'hosting'
          ? await Promise.all([api('/api/events'), api('/api/events?archived=1')])
          : [await api('/api/events/going'), { events: [] }];
        if (requestId !== loadRequestId || requestedLoadView !== activeView) return;
        const archived = archivedResult.events;

        const upcoming = events.filter(e => isUpcomingEventDate(e.event_date)).reverse();
        const past = events.filter(e => !isUpcomingEventDate(e.event_date));

        document.getElementById('empty').style.display =
          (!events.length && !archived.length) ? 'block' : 'none';

        document.getElementById('upcoming-section').style.display = upcoming.length ? 'block' : 'none';
        document.getElementById('upcoming').innerHTML = upcoming.map(ev => requestedLoadView === 'hosting' ? swipeWrap(ev, card(ev)) : card(ev, 'going')).join('');
        document.getElementById('upcoming').classList.toggle('visible', upcoming.length > 0);

        document.getElementById('past-section').style.display = past.length ? 'block' : 'none';
        document.getElementById('past-label').textContent = `Past (${past.length})`;
        document.getElementById('past').innerHTML = past.map(ev => requestedLoadView === 'hosting' ? swipeWrap(ev, card(ev)) : card(ev, 'going')).join('');
        document.getElementById('past').classList.remove('visible');

        document.getElementById('archived-section').style.display = requestedLoadView === 'hosting' && archived.length ? 'block' : 'none';
        document.getElementById('archived-label').textContent = `Archived (${archived.length})`;
        document.getElementById('archived').innerHTML = archived.map(archivedCard).join('');
        document.getElementById('archived').classList.remove('visible');
        loading.hidden = true;
      } catch (_) {
        if (requestId !== loadRequestId || requestedLoadView !== activeView) return;
        loading.removeAttribute('aria-label');
        loading.innerHTML = `<div class="events-load-error"><h2>We couldn't load your events.</h2><p>Your events are safe. Try loading the page again.</p><button class="sg-btn sg-btn-ghost" id="retry-events" type="button">Try again</button></div>`;
        document.getElementById('retry-events').addEventListener('click', () => location.reload());
      } finally {
        if (requestId === loadRequestId && requestedLoadView === activeView) content.setAttribute('aria-busy', 'false');
      }
    }
    const eventTabs = Array.from(document.querySelectorAll('.events-tab'));
    eventTabs.forEach((tab, index) => {
      tab.addEventListener('click', () => {
        userSelectedView = true;
        try { localStorage.setItem(VIEW_KEY, tab.dataset.view); } catch (_) {}
        if (tab.dataset.view === activeView) return;
        activeView = tab.dataset.view;
        document.getElementById('upcoming').innerHTML = '';
        document.getElementById('past').innerHTML = '';
        document.getElementById('archived').innerHTML = '';
        document.getElementById('empty').style.display = 'none';
        load();
      });
      tab.addEventListener('keydown', event => {
        let targetIndex = null;
        if (event.key === 'ArrowRight') targetIndex = (index + 1) % eventTabs.length;
        else if (event.key === 'ArrowLeft') targetIndex = (index - 1 + eventTabs.length) % eventTabs.length;
        else if (event.key === 'Home') targetIndex = 0;
        else if (event.key === 'End') targetIndex = eventTabs.length - 1;
        if (targetIndex === null) return;
        event.preventDefault();
        eventTabs[targetIndex].focus();
      });
    });
    chooseInitialView.then(() => {
      if (!userSelectedView) load();
    });
  </script>
</body>
</html>

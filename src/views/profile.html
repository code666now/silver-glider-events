<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E0E">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Profile — Silver Glider Events</title>
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/legal-footer.js" defer></script>
  <style>
    .profile-shell { max-width: 640px; }
    .profile-card { display: grid; justify-items: center; text-align: center; padding: 18px 0 8px; }
    .profile-photo { position: relative; width: 148px; height: 148px; margin-bottom: 22px; }
    .profile-avatar {
      width: 100%; height: 100%; display: grid; place-items: center; overflow: hidden; border-radius: 50%;
      background: linear-gradient(145deg, rgba(28,197,190,.7), rgba(28,197,190,.18) 55%, rgba(40,40,46,.95));
      box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 24px 60px rgba(0,0,0,.45);
      color: #fff; font: 700 48px/1 var(--sg-font-display); letter-spacing: .02em;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-photo-button {
      position: absolute; right: 0; bottom: 2px; width: 48px; height: 48px; display: grid; place-items: center;
      border: 3px solid var(--sg-bg); border-radius: 50%; background: var(--sg-text); color: #0a0a0a; cursor: pointer;
    }
    .profile-photo-button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .profile-photo-button:disabled { cursor: wait; opacity: .7; }
    .profile-photo-button:focus-visible { outline: 2px solid var(--sg-accent); outline-offset: 3px; }
    .profile-name { margin: 0; font-size: clamp(30px, 8vw, 40px); line-height: 1.1; overflow-wrap: anywhere; }
    .profile-joined { margin: 10px 0 0; color: var(--sg-text-dim); font-size: 15px; }
    .profile-status { min-height: 20px; margin: 8px 0 0; color: var(--sg-text-dim); font-size: 13px; }
    .profile-edit { min-width: 220px; margin-top: 18px; }
    .profile-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 34px; }
    .profile-stat {
      display: grid; justify-items: center; gap: 6px; padding: 24px 12px; border-radius: 22px;
      border: 1px solid rgba(28,197,190,.28);
      background: radial-gradient(120% 90% at 50% 0%, rgba(28,197,190,.16), rgba(255,255,255,.02) 70%);
    }
    .profile-stat:nth-child(2) {
      border-color: rgba(200,205,215,.26);
      background: radial-gradient(120% 90% at 50% 0%, rgba(200,205,215,.14), rgba(255,255,255,.02) 70%);
    }
    .profile-stat strong { font: 700 44px/1 var(--sg-font-display); }
    .profile-stat span { text-align: center; color: var(--sg-text-dim); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .profile-host {
      display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; min-height: 72px; margin-top: 16px;
      padding: 0 20px; border: 1px solid var(--sg-border-soft); border-radius: 18px; background: rgba(255,255,255,.025); color: var(--sg-text);
    }
    .profile-host strong, .profile-host small { display: block; }
    .profile-host strong { font-size: 16px; }
    .profile-host small { margin-top: 3px; color: var(--sg-text-dim); font-size: 13px; }
    .profile-host span[aria-hidden] { color: var(--sg-text-faint); font-size: 26px; }
    .profile-host:focus-visible { outline: 2px solid var(--sg-accent); outline-offset: 3px; }
    .profile-skeleton .sg-skeleton { display: block; }
  </style>
</head>
<body>
  <div class="sg-shell profile-shell">
    <nav id="nav"></nav>
    <main class="profile-card" aria-busy="true" id="profile">
      <div class="profile-photo">
        <span class="profile-avatar" data-sg-avatar><span data-sg-initials></span><img alt="" hidden></span>
        <button class="profile-photo-button" id="profile-photo-button" type="button" aria-label="Change your photo" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
        <input id="profile-photo-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
      </div>
      <h1 class="profile-name" data-sg-name>&nbsp;</h1>
      <p class="profile-joined" id="profile-joined">&nbsp;</p>
      <p class="profile-status" id="profile-status" role="status" aria-live="polite"></p>
      <a class="sg-btn sg-btn-ghost profile-edit" href="/settings/account">Edit profile</a>
    </main>
    <section class="profile-stats" aria-label="Your events">
      <div class="profile-stat"><strong id="stat-attended">–</strong><span>Attended</span></div>
      <div class="profile-stat"><strong id="stat-hosted">–</strong><span>Hosted</span></div>
    </section>
    <a class="profile-host" id="profile-host" href="/settings/host-page" hidden>
      <span><strong id="profile-host-title">Your host page</strong><small id="profile-host-copy">See what guests see.</small></span>
      <span aria-hidden="true">›</span>
    </a>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/image-optimizer.js"></script>
  <script>
    renderNav('profile');
    const $ = id => document.getElementById(id);

    function showAccount(organizer) {
      updateNavAccount(organizer);
      const joined = new Date(organizer.created_at);
      $('profile-joined').textContent = Number.isNaN(joined.getTime())
        ? ''
        : `Joined ${joined.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}`;
      const host = $('profile-host');
      if (organizer.public_slug) {
        host.href = `/h/${encodeURIComponent(organizer.public_slug)}`;
        $('profile-host-title').textContent = 'Your host page';
        $('profile-host-copy').textContent = 'See what guests see.';
      } else {
        host.href = '/settings/host-page';
        $('profile-host-title').textContent = 'Set up your host page';
        $('profile-host-copy').textContent = 'A public page for all your events.';
      }
      host.hidden = false;
      $('profile-photo-button').disabled = false;
      $('profile').setAttribute('aria-busy', 'false');
    }

    api('/api/auth/me').then(({ organizer }) => showAccount(organizer)).catch(() => {
      $('profile-status').textContent = 'Your profile could not be loaded. Try again.';
    });
    api('/api/me/stats').then(stats => {
      $('stat-attended').textContent = Number(stats.attended) || 0;
      $('stat-hosted').textContent = Number(stats.hosted) || 0;
    }).catch(() => {});

    // Same upload path as Settings → Account; saves only the account photo.
    $('profile-photo-button').addEventListener('click', () => $('profile-photo-input').click());
    $('profile-photo-input').addEventListener('change', async () => {
      const input = $('profile-photo-input');
      const button = $('profile-photo-button');
      const status = $('profile-status');
      const file = input.files[0];
      if (!file) return;
      if (!/^image\/(jpeg|png|webp|gif)$/.test(file.type)) {
        status.textContent = 'Choose a JPG, PNG, WebP, or GIF image.';
        input.value = '';
        return;
      }
      button.disabled = true;
      status.textContent = 'Saving your photo…';
      try {
        const uploadFile = await window.SGImageOptimizer.optimizeAvatar(file);
        const form = new FormData();
        form.append('image', uploadFile);
        const response = await fetch('/api/uploads/avatar', { method: 'POST', body: form });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Upload failed');
        updateNavAccount(data.organizer);
        status.textContent = 'Photo saved.';
      } catch (error) {
        status.textContent = error.message;
      } finally {
        button.disabled = false;
        input.value = '';
      }
    });
  </script>
</body>
</html>

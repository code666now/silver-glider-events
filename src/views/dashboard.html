<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E0E">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Home — Silver Glider Events</title>
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/legal-footer.js" defer></script>
  <style>
    .next-card {
      display: block;
      overflow: hidden;
      color: var(--sg-text);
      background: rgba(17,17,17,.92);
      border: 1px solid var(--sg-border-soft);
      border-radius: 28px;
      box-shadow: var(--sg-shadow);
      transition: border-color .15s ease, transform .15s ease;
    }
    @media (hover: hover) { .next-card:hover {
      border-color: rgba(28,197,190,.42);
      transform: translateY(-1px);
    } }
    .next-visual {
      position: relative;
      aspect-ratio: 16 / 10;
      background: var(--sg-surface);
      overflow: hidden;
    }
    .next-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .next-visual img.flyer { object-fit: contain; background:#090909; }
    .next-visual.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--sg-text-faint);
      font-family: var(--sg-font-display);
      font-size: 56px;
    }
    .next-visual::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 46%, rgba(14,14,14,.9) 100%);
      pointer-events: none;
    }
    .next-details {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      padding: 20px;
    }
    .next-details > div:first-child { min-width: 0; }
    .next-details h2 {
      font-size: 28px;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .next-details p {
      color: var(--sg-text-dim);
      font-size: 14px;
    }
    .next-count {
      text-align: right;
      flex-shrink: 0;
    }
    .next-count strong {
      display: block;
      font-family: var(--sg-font-display);
      font-size: 34px;
      line-height: 1;
    }
    .next-count span {
      color: var(--sg-text-faint);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .next-card:focus-visible { outline:2px solid var(--sg-accent);outline-offset:4px; }
    .next-plan-actions { display:flex;flex-wrap:wrap;gap:10px;padding:0 20px 20px; }
    .next-plan-actions .sg-btn { min-height:44px; }
    .next-plan-host { margin-top:6px; }
    .next-plan .next-count strong { font-size:22px; }
    .next-plan .next-details h2 { white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.2; }
    .dashboard-overview[hidden] { display:none; }
    div.dashboard-empty { cursor:default; }
    .dashboard-error { padding:32px 22px;border:1px solid var(--sg-border-soft);border-radius:24px;color:var(--sg-text-dim);line-height:1.6; }
    .dashboard-error .sg-btn { margin-top:16px; }
    .dashboard-stats {
      color: var(--sg-text-dim);
      font-size: 14px;
      text-align: center;
      margin: 20px 0 14px;
    }
    .dashboard-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .dashboard-desktop-only { display: none; }
    .dashboard-overview { display: none; }
    .dashboard-empty { display: none; }
    .dashboard-skeleton {
      overflow: hidden;
      border: 1px solid var(--sg-border-soft);
      border-radius: 28px;
      background: rgba(17,17,17,.78);
    }
    .dashboard-skeleton-visual {
      aspect-ratio: 16 / 10;
      border-bottom: 1px solid var(--sg-border-soft);
    }
    .dashboard-skeleton-details {
      display: grid;
      gap: 12px;
      padding: 22px;
    }
    .dashboard-skeleton .dashboard-skeleton-visual { border-radius: 0; }
    .dashboard-skeleton-title { width: 48%; height: 24px; }
    .dashboard-skeleton-meta { width: 66%; height: 13px; }
    .dashboard-stat-skeleton { width: 38px; height: 32px; margin-bottom: 5px; }
    @media (min-width: 1024px) {
      .dashboard-shell {
        max-width: 1260px;
        padding-right: 32px;
        padding-left: 32px;
        padding-bottom: 96px;
      }
      .dashboard-shell .sg-nav { margin-bottom: 42px; }
      .dashboard-header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 32px;
        margin-bottom: 30px;
      }
      .dashboard-header .sg-page-sub { margin-bottom: 0; }
      .dashboard-eyebrow {
        color: var(--sg-accent);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .15em;
        text-transform: uppercase;
      }
      .dashboard-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(310px, 360px);
        gap: clamp(30px, 4vw, 54px);
        align-items: start;
      }
      .dashboard-feature,
      .dashboard-sidebar { min-width: 0; }
      .dashboard-section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        min-height: 39px;
        margin-bottom: 14px;
      }
      .dashboard-section-head h2,
      .dashboard-overview h2 {
        font-size: 20px;
      }
      .dashboard-section-head a {
        color: var(--sg-text-dim);
        font-size: 12px;
        font-weight: 700;
      }
      @media (hover: hover) { .dashboard-section-head a:hover { color: var(--sg-accent); } }
      .next-card { border-radius: 24px; }
      .next-visual { aspect-ratio: 16 / 9; }
      .dashboard-skeleton { border-radius: 24px; }
      .dashboard-skeleton-visual { aspect-ratio: 16 / 9; }
      .next-details { padding: 24px 26px; }
      .dashboard-empty {
        min-height: 470px;
        display: grid;
        place-items: center;
        padding: 44px;
        border: 1px dashed rgba(28,197,190,.24);
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(28,197,190,.045), rgba(255,255,255,.012));
        color: var(--sg-text);
        text-align: center;
        cursor: pointer;
        transition: border-color .15s ease, background .15s ease, transform .15s ease;
      }
      @media (hover: hover) { .dashboard-empty:hover {
        border-color: rgba(28,197,190,.5);
        background: linear-gradient(145deg, rgba(28,197,190,.075), rgba(255,255,255,.018));
        transform: translateY(-1px);
      } }
      .dashboard-empty:focus-visible {
        outline: 2px solid var(--sg-accent);
        outline-offset: 4px;
      }
      .dashboard-empty-mark {
        width: 54px;
        height: 54px;
        display: grid;
        place-items: center;
        margin: 0 auto 20px;
        border: 1px solid rgba(28,197,190,.28);
        border-radius: 18px;
        color: var(--sg-accent);
        background: rgba(28,197,190,.08);
        font-family: var(--sg-font-display);
        font-size: 28px;
      }
      .dashboard-empty h3 { margin-bottom: 9px; font-size: 26px; }
      .dashboard-empty p {
        max-width: 360px;
        color: var(--sg-text-dim);
        font-size: 14px;
        line-height: 1.6;
      }
      .dashboard-sidebar {
        display: grid;
        gap: 16px;
        padding-top: 53px;
      }
      .dashboard-overview {
        display: block;
        padding: 24px;
        border: 1px solid var(--sg-border-soft);
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(19,19,21,.78), rgba(11,11,13,.62));
        box-shadow: 0 18px 55px rgba(0,0,0,.14);
      }
      .dashboard-overview-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }
      .dashboard-overview-head span {
        color: var(--sg-text-faint);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
      .dashboard-stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .dashboard-stat {
        min-width: 0;
        padding: 18px;
        border: 1px solid var(--sg-border-soft);
        border-radius: 18px;
        background: rgba(255,255,255,.025);
      }
      .dashboard-stat-primary {
        grid-column: 1 / -1;
        background: linear-gradient(125deg, rgba(28,197,190,.12), rgba(28,197,190,.025));
        border-color: rgba(28,197,190,.22);
      }
      .dashboard-stat strong {
        display: block;
        margin-bottom: 5px;
        font-family: var(--sg-font-display);
        font-size: 32px;
        line-height: 1;
      }
      .dashboard-stat span {
        color: var(--sg-text-dim);
        font-size: 11px;
        font-weight: 700;
      }
      .dashboard-stats { display: none; }
      .dashboard-actions {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .dashboard-actions .sg-btn { min-height: 50px; }
      .dashboard-social-footer { margin-top: 54px; }
      .dashboard-desktop-only { display: flex; }
    }
    @media (min-width: 880px) and (max-width: 1023px) {
      .dashboard-empty {
        min-height: 380px;
        display: grid;
        place-items: center;
        padding: 40px;
        border: 1px dashed rgba(28,197,190,.24);
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(28,197,190,.045), rgba(255,255,255,.012));
        color: var(--sg-text);
        text-align: center;
        cursor: pointer;
        transition: border-color .15s ease, background .15s ease, transform .15s ease;
      }
      @media (hover: hover) { .dashboard-empty:hover { border-color:rgba(28,197,190,.5);background:linear-gradient(145deg,rgba(28,197,190,.075),rgba(255,255,255,.018));transform:translateY(-1px); } }
      .dashboard-empty:focus-visible { outline:2px solid var(--sg-accent);outline-offset:4px; }
      .dashboard-empty-mark {
        width: 54px;
        height: 54px;
        display: grid;
        place-items: center;
        margin: 0 auto 20px;
        border: 1px solid rgba(28,197,190,.28);
        border-radius: 18px;
        background: rgba(28,197,190,.08);
        color: var(--sg-accent);
        font-family: var(--sg-font-display);
        font-size: 28px;
      }
      .dashboard-empty h3 { margin-bottom: 9px; font-size: 26px; }
      .dashboard-empty p { max-width: 360px; color: var(--sg-text-dim); font-size: 14px; line-height: 1.6; }
    }
    @media (max-width: 520px) {
      .next-details { padding: 18px; }
      .next-details h2 { font-size: 24px; }
      .dashboard-actions { grid-template-columns: 1fr; }
    }
    @media (max-width: 879px) {
      .dashboard-header {
        margin-bottom: 28px;
      }
      .dashboard-header .sg-page-title {
        overflow-wrap: anywhere;
      }
      .dashboard-header .sg-page-sub {
        margin-bottom: 0;
      }
      .dashboard-layout {
        display: grid;
        gap: 26px;
      }
      .next-card,
      .dashboard-skeleton {
        border-radius: var(--sg-mobile-card-radius);
        box-shadow: 0 12px 34px rgba(0,0,0,.26);
      }
      @media (hover: hover) { .next-card:hover { transform:none; } }
      .next-visual,
      .dashboard-skeleton-visual {
        aspect-ratio: 16 / 9;
      }
      .next-details {
        grid-template-columns: minmax(0,1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 20px;
      }
      .next-details h2 {
        margin-bottom: 7px;
        font-size: var(--sg-mobile-section-title-size);
      }
      .next-details p {
        font-size: 14px;
        line-height: 1.5;
      }
      .next-count strong {
        font-size: 32px;
      }
      .next-count span {
        font-size: 11px;
        line-height: 1.25;
      }
      .dashboard-sidebar {
        min-width: 0;
      }
      .dashboard-stats {
        margin: 0 0 16px;
        font-size: 14px;
        line-height: 1.55;
      }
      .dashboard-actions {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .dashboard-actions .sg-btn:not(.sg-mobile-sticky-action) {
        min-height: 56px;
      }
      .dashboard-empty {
        min-height: 320px;
        display: grid;
        place-items: center;
        padding: 34px 22px;
        border: 1px dashed rgba(28,197,190,.28);
        border-radius: var(--sg-mobile-card-radius);
        background: linear-gradient(145deg, rgba(28,197,190,.055), rgba(255,255,255,.014));
        color: var(--sg-text);
        text-align: center;
      }
      .dashboard-empty:focus-visible {
        outline: 2px solid var(--sg-accent);
        outline-offset: 4px;
      }
      .dashboard-empty-mark {
        width: 60px;
        height: 60px;
        display: grid;
        place-items: center;
        margin: 0 auto 20px;
        border: 1px solid rgba(28,197,190,.32);
        border-radius: 20px;
        background: rgba(28,197,190,.09);
        color: var(--sg-accent);
        font-family: var(--sg-font-display);
        font-size: 31px;
      }
      .dashboard-empty h3 {
        margin-bottom: 10px;
        font-size: var(--sg-mobile-section-title-size);
      }
      .dashboard-empty p {
        max-width: 390px;
        color: var(--sg-text-dim);
        font-size: 15px;
        line-height: 1.65;
      }
      .dashboard-skeleton-details {
        padding: 20px;
      }
      .dashboard-social-footer {
        margin-top: 44px;
      }
    }
  </style>
</head>
<body class="has-mobile-sticky-action">
  <div class="sg-shell dashboard-shell">
    <nav id="nav"></nav>
    <header class="dashboard-header">
      <div>
        <h1 class="sg-page-title" id="greeting">Welcome</h1>
        <p class="sg-page-sub" id="sub">Your events at a glance.</p>
      </div>
      <p class="dashboard-eyebrow dashboard-desktop-only">Home base</p>
    </header>

    <div class="dashboard-layout">
      <section class="dashboard-feature" aria-labelledby="next-up-heading">
        <div class="dashboard-section-head dashboard-desktop-only">
          <h2 id="next-up-heading">Next up</h2>
          <a id="dashboard-view-all" href="/events">View all events →</a>
        </div>
        <div id="next-event" aria-live="polite" aria-busy="true">
          <div class="dashboard-skeleton" aria-hidden="true">
            <div class="dashboard-skeleton-visual dashboard-skeleton-line sg-skeleton"></div>
            <div class="dashboard-skeleton-details">
              <span class="dashboard-skeleton-line dashboard-skeleton-title sg-skeleton"></span>
              <span class="dashboard-skeleton-line dashboard-skeleton-meta sg-skeleton"></span>
            </div>
          </div>
        </div>
      </section>

      <aside class="dashboard-sidebar" aria-label="Event overview and actions">
        <section class="dashboard-overview" aria-labelledby="overview-heading">
          <div class="dashboard-overview-head">
            <h2 id="overview-heading">At a glance</h2>
            <span>Hosting</span>
          </div>
          <div class="dashboard-stat-grid" aria-live="polite" aria-busy="true">
            <div class="dashboard-stat dashboard-stat-primary"><strong id="upcoming-count"><span class="dashboard-stat-skeleton sg-skeleton" aria-hidden="true"></span></strong><span>Upcoming events</span></div>
            <div class="dashboard-stat"><strong id="rsvp-count"><span class="dashboard-stat-skeleton sg-skeleton" aria-hidden="true"></span></strong><span>Total RSVPs</span></div>
            <div class="dashboard-stat"><strong id="event-count"><span class="dashboard-stat-skeleton sg-skeleton" aria-hidden="true"></span></strong><span>Total events</span></div>
          </div>
        </section>

        <p class="dashboard-stats" id="dashboard-stats"></p>

        <div class="dashboard-actions">
          <a id="dashboard-create" class="sg-btn sg-btn-primary sg-btn-block sg-mobile-sticky-action" href="/events/new">Create Event</a>
          <a id="dashboard-my-events" class="sg-btn sg-btn-ghost sg-btn-block" href="/events">My Events</a>
        </div>
      </aside>
    </div>
    <footer class="sg-social-footer dashboard-social-footer" data-sg-legal-footer>
      <a class="sg-social-link" href="https://www.instagram.com/silverglidertix/" target="_blank" rel="noopener noreferrer" aria-label="Follow Silver Glider on Instagram at @silverglidertix">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"></circle>
        </svg>
      </a>
      <div class="sg-legal-links">
        <a href="/privacy" class="sg-legal-link">Privacy Policy</a>
        <span aria-hidden="true">·</span>
        <a href="/terms" class="sg-legal-link">Terms</a>
      </div>
    </footer>
  </div>

  <script src="/js/api.js"></script>
  <script>
    renderNav('dashboard');
    const dashboardMobileLayout = window.matchMedia('(max-width: 879px)');

    function syncDashboardEmptyCardAction() {
      document.querySelectorAll('a.dashboard-empty').forEach(card => {
        if (!card.dataset.desktopAriaLabel) {
          card.dataset.desktopAriaLabel = card.getAttribute('aria-label') || 'Create an event';
        }
        if (dashboardMobileLayout.matches) {
          if (document.activeElement === card) document.querySelector('.sg-mobile-sticky-action')?.focus();
          card.removeAttribute('href');
          card.removeAttribute('aria-label');
        } else {
          card.setAttribute('href', '/events/new');
          card.setAttribute('aria-label', card.dataset.desktopAriaLabel);
        }
      });
    }

    if (dashboardMobileLayout.addEventListener) dashboardMobileLayout.addEventListener('change', syncDashboardEmptyCardAction);
    else dashboardMobileLayout.addListener(syncDashboardEmptyCardAction);

    function planStart(event) {
      return new Date(event.starts_at || `${String(event.event_date).slice(0, 10)}T${event.start_time || '00:00'}`).getTime();
    }

    function hasUpcomingPlan(event) {
      // Both authenticated event APIs use the canonical timezone/overnight
      // end calculation. An event stays handy until it actually ends.
      return event.status === 'published' && new Date(event.ends_at).getTime() > Date.now();
    }

    (async () => {
      const container = document.getElementById('next-event');
      const statGrid = document.querySelector('.dashboard-stat-grid');
      const finishLoading = () => {
        container.setAttribute('aria-busy', 'false');
        statGrid.setAttribute('aria-busy', 'false');
      };

      try {
        // Reuse Going for guests and artists. Home never creates a separate
        // plans model or asks somebody who already RSVP'd to start again.
        const [{ organizer }, { events }, going] = await Promise.all([
          api('/api/auth/me'),
          api('/api/events'),
          api('/api/events/going')
        ]);
        const plans = (going.events || []).filter(hasUpcomingPlan)
          .map(item => ({ ...item, isPlaying: Boolean(item.playing), isGoing: !item.playing }));
        document.getElementById('greeting').textContent =
          organizer.name ? `Welcome back, ${organizer.name.split(' ')[0]}` : 'Welcome';
        const hostedUpcoming = events.filter(hasUpcomingPlan);
        // An event somebody both hosts and attends stays one management card.
        const hostedIds = new Set(hostedUpcoming.map(event => Number(event.id)));
        const upcoming = [...hostedUpcoming, ...plans.filter(event => !hostedIds.has(Number(event.id)))];
        const totalRsvps = events.reduce((sum, item) => sum + Number(item.rsvp_count || 0), 0);
        document.getElementById('upcoming-count').textContent = String(hostedUpcoming.length);
        document.getElementById('rsvp-count').textContent = String(totalRsvps);
        document.getElementById('event-count').textContent = String(events.length);
        if (!events.length) {
          document.querySelector('.dashboard-overview').hidden = true;
          const create = document.getElementById('dashboard-create');
          create.classList.remove('sg-btn-primary', 'sg-mobile-sticky-action');
          create.classList.add('sg-btn-ghost');
          document.body.classList.remove('has-mobile-sticky-action');
          document.getElementById('dashboard-my-events').href = '/events?view=going';
          document.getElementById('dashboard-my-events').textContent = 'My plans';
          document.getElementById('dashboard-view-all').href = '/events?view=going';
          document.getElementById('dashboard-view-all').textContent = 'View all plans →';
        }
        if (!upcoming.length) {
          document.getElementById('sub').textContent = events.length
            ? 'No upcoming events. Create one when you are ready.' : 'Your next good night is still ahead.';
          document.getElementById('dashboard-stats').textContent =
            `${events.length} total event${events.length === 1 ? '' : 's'} · ${totalRsvps} total RSVP${totalRsvps === 1 ? '' : 's'}`;
          container.innerHTML = events.length
            ? '<a class="dashboard-empty" href="/events/new" aria-label="Create your next event"><div><div class="dashboard-empty-mark" aria-hidden="true">+</div><h3>Your next event starts here.</h3><p>Create a polished event page, then manage every RSVP from one place.</p></div></a>'
            : '<div class="dashboard-empty"><div><div class="dashboard-empty-mark" aria-hidden="true">↗</div><h3>No upcoming plans yet.</h3><p>Events you RSVP to will appear here. See what’s coming up from the people you follow.</p><a class="sg-btn sg-btn-primary" href="/following" style="margin-top:20px">See Following</a></div></div>';
          if (!events.length) {
            document.getElementById('dashboard-stats').textContent = '';
            document.body.classList.remove('has-mobile-sticky-action');
            document.querySelector('.sg-mobile-sticky-action')?.classList.remove('sg-mobile-sticky-action');
          }
          syncDashboardEmptyCardAction();
          finishLoading();
          return;
        }
        const ev = upcoming.sort((a, b) => planStart(a) - planStart(b) || Number(a.id) - Number(b.id))[0];
        const dateStr = new Date(ev.event_date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
        const timeParts = String(ev.start_time || '').match(/^(\d{2}):(\d{2})/);
        const clock = timeParts ? `${Number(timeParts[1]) % 12 || 12}:${timeParts[2]} ${Number(timeParts[1]) >= 12 ? 'PM' : 'AM'}` : '';
        const title = String(ev.title || 'Untitled event');
        const flyerMode = ev.presentation_mode === 'flyer';
        const coverUrl = flyerMode
          ? sgSafeHttpUrl(ev.flyer_image_url)
          : sgSafeHttpUrl(ev.cover_image_url);
        const rsvpCount = Number(ev.rsvp_count) || 0;
        const capacity = Number(ev.capacity) || 0;
        document.getElementById('sub').textContent = ev.isPlaying || ev.isGoing ? 'Your next night.' : 'Your next event.';
        document.getElementById('dashboard-stats').textContent = hostedUpcoming.length
          ? `${hostedUpcoming.length} upcoming event${hostedUpcoming.length === 1 ? '' : 's'} you host · ${totalRsvps} total RSVP${totalRsvps === 1 ? '' : 's'}`
          : `${plans.length} upcoming plan${plans.length === 1 ? '' : 's'}`;
        const eventPath = `/e/${encodeURIComponent(String(ev.slug))}`;
        if (ev.isGoing) {
          // The event page rechecks the signed-in RSVP before exposing a
          // protected location. No address or personal token goes in this link.
          document.body.classList.remove('has-mobile-sticky-action');
          document.querySelector('.sg-mobile-sticky-action')?.classList.remove('sg-mobile-sticky-action');
        }
        container.innerHTML = `
          ${ev.isGoing ? '<article class="next-card next-plan">' : `<a class="next-card" href="${ev.isPlaying ? eventPath : `/events/${encodeURIComponent(String(ev.id))}/manage`}">`}
            ${coverUrl
              ? `<div class="next-visual"><img class="${flyerMode ? 'flyer' : ''}" src="${sgEscapeHtml(coverUrl)}" alt=""></div>`
              : `<div class="next-visual placeholder">${sgEscapeHtml(title.charAt(0).toUpperCase())}</div>`}
            <div class="next-details">
              <div>
                <h2>${sgEscapeHtml(title)}</h2>
                <p>${sgEscapeHtml(dateStr)}${clock ? ` · ${sgEscapeHtml(clock)}` : ''}</p>
                ${ev.venue_name ? `<p>${sgEscapeHtml(ev.venue_name)}</p>` : ''}
                ${ev.isGoing && ev.host_name ? `<p class="next-plan-host">Hosted by ${sgEscapeHtml(ev.host_name)}</p>` : ''}
              </div>
              <div class="next-count">
                ${ev.isGoing ? '<strong>Going</strong><span>Your RSVP</span>' : ev.isPlaying
                  ? '<strong>Playing</strong><span>View event</span>'
                  : `<strong>${rsvpCount}</strong><span>going${capacity ? ` / ${capacity}` : ''}</span>`}
              </div>
            </div>
            ${ev.isGoing ? `<div class="next-plan-actions"><a class="sg-btn sg-btn-primary" href="${eventPath}#returning-rsvp-state">View RSVP</a><a class="sg-btn sg-btn-ghost" href="${eventPath}#event-location-map">Get directions</a></div></article>` : '</a>'}`;
        finishLoading();
      } catch (_) {
        document.getElementById('sub').textContent = 'Your plans could not be loaded.';
        document.getElementById('upcoming-count').textContent = '—';
        document.getElementById('rsvp-count').textContent = '—';
        document.getElementById('event-count').textContent = '—';
        container.innerHTML = '<div class="dashboard-error" role="alert"><p>We couldn’t load your events. Your RSVPs haven’t changed.</p><a class="sg-btn sg-btn-ghost" href="/dashboard">Try again</a></div>';
        finishLoading();
      }
    })();
  </script>
</body>
</html>

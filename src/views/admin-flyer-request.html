<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E0E">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Flyer request — Done For You — Silver Glider Events</title>
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin-shell.css">
  <link rel="stylesheet" href="/css/admin-done-for-you.css">
  <script src="/js/legal-footer.js" defer></script>
</head>
<body data-admin-section="done-for-you">
  <main class="sg-shell dfy-shell" data-admin-section="done-for-you">
    <nav id="nav"></nav>
    <a class="dfy-back-link" href="/admin/done-for-you"><span aria-hidden="true">‹</span> Flyer requests</a>

    <section id="flyer-request-loading" class="dfy-detail-loading" aria-live="polite">
      <span class="sg-skeleton dfy-detail-title-skeleton"></span>
      <span class="sg-skeleton dfy-detail-copy-skeleton"></span>
      <span class="sg-skeleton dfy-detail-card-skeleton"></span>
    </section>
    <section id="flyer-request-error" class="admin-load-error" hidden></section>

    <article id="flyer-request-detail" class="dfy-request-detail" hidden>
      <header class="dfy-page-head dfy-detail-head">
        <div>
          <p class="dfy-eyebrow">Flyer request</p>
          <div class="dfy-title-row"><h1 class="sg-page-title" id="flyer-request-title">Flyer request</h1><span class="dfy-status-pill" id="flyer-request-status">Submitted</span></div>
          <p class="sg-page-sub" id="flyer-request-subtitle"></p>
        </div>
      </header>

      <div class="dfy-request-detail-grid">
        <section class="dfy-panel dfy-request-flyer-panel" aria-labelledby="flyer-art-heading">
          <div class="dfy-panel-head"><div><h2 id="flyer-art-heading">Submitted flyer</h2><p>The original artwork stays attached to this request.</p></div></div>
          <div class="dfy-request-flyer"><img id="flyer-request-image" alt="Submitted event flyer"></div>
          <dl class="dfy-request-facts" id="flyer-request-facts"></dl>
        </section>

        <div>
          <section class="dfy-panel" aria-labelledby="flyer-match-heading">
            <div class="dfy-panel-head"><div><h2 id="flyer-match-heading">Account match</h2><p>Review the permanent owner before creating anything.</p></div></div>
            <div id="flyer-request-match"></div>
          </section>

          <section class="dfy-panel" aria-labelledby="flyer-work-heading">
            <div class="dfy-panel-head"><div><h2 id="flyer-work-heading">Build the event</h2><p>The flyer opens in the existing private Done For You editor.</p></div></div>
            <div class="dfy-request-workflow" id="flyer-request-workflow"></div>
            <p class="dfy-action-status" id="flyer-request-action-status" role="status" aria-live="polite"></p>
          </section>
        </div>
      </div>
    </article>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/admin-shell.js"></script>
  <script src="/js/admin-flyer-request.js"></script>
</body>
</html>

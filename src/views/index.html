<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Silver Glider Events | You have a personality. Your events should too.</title>
  <meta property="og:title" content="Silver Glider Events">
  <meta property="og:description" content="Create a beautiful event page, collect RSVPs or connect ticket sales, and keep your guest list organized in one place.">
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/home-orbit.css">
  <script src="/js/legal-footer.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/home-account-nav.js" defer></script>
  <script src="/js/home-orbit.js" defer></script>
</head>
<body class="sg-home-page">
  <div class="sg-aurora" aria-hidden="true"></div>
  <div class="sg-aurora-veil" aria-hidden="true"></div>
  <div class="home-orbit-page" id="home-page">
    <header class="sg-home-header home-orbit-topbar">
      <a class="home-orbit-brand" href="/" aria-label="Silver Glider Events homepage">
        <img src="/logo.png" width="45" height="45" alt="">
        <span>Silver Glider<small>Events</small></span>
      </a>
      <nav class="sg-home-account-shell" data-home-account-shell data-loading="true" aria-label="Account">
        <a class="sg-btn sg-btn-ghost sg-home-signin" data-home-signin href="/login?next=%2Fdashboard">Sign in</a>
        <div class="sg-home-authenticated" data-home-authenticated hidden></div>
      </nav>
    </header>

    <main class="home-orbit-stage" data-home-orbit-stage>
      <section class="home-orbit-hero" data-home-orbit-hero aria-labelledby="home-orbit-title">
        <img class="home-orbit-hero-plane" src="/logo.png" width="54" height="54" alt="">
        <h1 id="home-orbit-title">You have a&nbsp;personality.<br><span>Your events should&nbsp;too.</span></h1>
        <a class="sg-btn sg-btn-primary home-orbit-cta" href="/login?next=%2Fevents%2Fnew">Create your event</a>
        <p class="home-orbit-free">Free to create and publish.</p>
      </section>
      <div class="home-orbit-gallery" data-home-orbit-gallery role="group" aria-label="Event photos"><!-- HOME_ORBIT_PHOTOS --></div>
    </main>

    <footer class="home-orbit-footer" data-sg-legal-footer aria-label="Site information">
      <div class="home-orbit-footer-main">
        <details class="home-orbit-credits">
          <summary>Photo credits</summary>
          <ul class="home-orbit-credits-list"><!-- HOME_ORBIT_CREDITS --></ul>
        </details>
        <nav class="home-orbit-footer-nav" aria-label="About Silver Glider">
          <a href="/how-it-works">How it works</a>
          <span aria-hidden="true" class="home-orbit-footer-separator">·</span>
          <a href="/recs">Going out instead? <span class="home-orbit-weekly">Get weekly picks</span></a>
        </nav>
      </div>
      <div class="home-orbit-social">
        <a class="home-orbit-social-link" href="https://www.instagram.com/silverglidertix/" target="_blank" rel="noopener noreferrer" aria-label="Follow Silver Glider on Instagram at @silverglidertix">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"></circle>
          </svg>
        </a>
        <nav class="sg-legal-links" aria-label="Legal links">
          <a class="sg-legal-link" href="/privacy">Privacy Policy</a><span aria-hidden="true">·</span>
          <a class="sg-legal-link" href="/terms">Terms</a><span aria-hidden="true">·</span>
          <a class="sg-legal-link" href="/accessibility">Accessibility</a>
        </nav>
      </div>
    </footer>
  </div>

</body>
</html>

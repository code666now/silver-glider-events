<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Line — Review — Silver Glider Events</title>
  <link rel="stylesheet" href="/css/brand.css">
  <script src="/js/legal-footer.js" defer></script>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .line-filters { display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px; }
    .line-review-grid { display:grid;gap:14px; }
    .line-review-card { margin:0;padding:22px; }
    @media(min-width:1024px) {
      .line-admin-shell { max-width:1260px;padding-right:32px;padding-left:32px;padding-bottom:96px; }
      .line-admin-shell .sg-nav { margin-bottom:42px; }
      .line-review-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .line-review-card { min-height:130px;display:flex;align-items:center; }
      .line-review-card > div { width:100%; }
    }
    @media(max-width:620px) {
      .line-review-card > div { flex-direction:column; }
      .line-review-card > div > div:last-child { width:100%; }
      .line-review-card .sg-btn { flex:1; }
    }
  </style>
</head>
<body>
  <div class="sg-shell line-admin-shell">
    <nav id="nav"></nav>
    <h1 class="sg-page-title">The Line</h1>
    <p class="sg-page-sub">Events submitted for feature on The Line.</p>
    <div class="admin-section-nav" aria-label="Admin sections">
      <a class="active" href="/admin/line">The Line</a>
      <a href="/admin/hosts">Hosts</a>
      <a href="/admin/feedback">Feedback</a>
      <a href="/admin/invitations">Invitations</a>
    </div>

    <div class="line-filters" id="filters">
      <button class="sg-btn sg-btn-ghost" data-status="pending" style="padding:8px 18px;font-size:13px" disabled>Pending</button>
      <button class="sg-btn sg-btn-ghost" data-status="approved" style="padding:8px 18px;font-size:13px" disabled>Approved</button>
      <button class="sg-btn sg-btn-ghost" data-status="rejected" style="padding:8px 18px;font-size:13px" disabled>Rejected</button>
    </div>

    <div class="line-review-grid" id="list" aria-busy="true">
      <div class="admin-skeleton-card admin-skeleton-row" aria-hidden="true"><span class="admin-skeleton-copy"><span class="sg-skeleton admin-skeleton-title"></span><span class="sg-skeleton admin-skeleton-meta"></span></span><span class="sg-skeleton admin-skeleton-action"></span></div>
      <div class="admin-skeleton-card admin-skeleton-row" aria-hidden="true"><span class="admin-skeleton-copy"><span class="sg-skeleton admin-skeleton-title"></span><span class="sg-skeleton admin-skeleton-meta"></span></span><span class="sg-skeleton admin-skeleton-action"></span></div>
    </div>
    <p id="empty" style="display:none;color:var(--sg-text-dim);text-align:center;padding:40px 0">Nothing here.</p>
  </div>

  <script src="/js/api.js"></script>
  <script>
    renderNav('');
    let current = 'pending';

    function fmt(d) {
      return new Date(d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
    }

    async function load() {
      const list = document.getElementById('list');
      const buttons = document.querySelectorAll('#filters button');
      list.setAttribute('aria-busy', 'true');
      document.getElementById('empty').style.display = 'none';
      buttons.forEach(button => { button.disabled = true; });
      list.innerHTML = `<div class="admin-skeleton-card admin-skeleton-row" aria-hidden="true"><span class="admin-skeleton-copy"><span class="sg-skeleton admin-skeleton-title"></span><span class="sg-skeleton admin-skeleton-meta"></span></span><span class="sg-skeleton admin-skeleton-action"></span></div><div class="admin-skeleton-card admin-skeleton-row" aria-hidden="true"><span class="admin-skeleton-copy"><span class="sg-skeleton admin-skeleton-title"></span><span class="sg-skeleton admin-skeleton-meta"></span></span><span class="sg-skeleton admin-skeleton-action"></span></div>`;
      document.querySelectorAll('#filters button').forEach(b => {
        b.style.borderColor = b.dataset.status === current ? 'var(--sg-accent)' : '';
        b.style.color = b.dataset.status === current ? 'var(--sg-accent)' : '';
      });
      try {
        const { submissions } = await api(`/api/admin/line-submissions?status=${current}`);
        document.getElementById('empty').style.display = submissions.length ? 'none' : 'block';
        list.innerHTML = submissions.map(s => {
        const id = Number(s.id);
        const host = s.org_name || s.organizer_name || s.organizer_email;
        return `
        <div class="sg-card line-review-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px">
            <div>
              <h3 style="font-size:18px;margin-bottom:4px"><a href="/e/${encodeURIComponent(String(s.slug))}" target="_blank" rel="noopener" style="color:var(--sg-text)">${sgEscapeHtml(s.title)}</a></h3>
              <p style="font-size:13px;color:var(--sg-text-dim)">${sgEscapeHtml(fmt(s.event_date))} · ${sgEscapeHtml(s.venue_name)}</p>
              <p style="font-size:12px;color:var(--sg-text-faint);margin-top:4px">${sgEscapeHtml(host)}</p>
            </div>
            ${current === 'pending' ? `
            <div style="display:flex;gap:8px;flex-shrink:0">
              <button class="sg-btn sg-btn-primary" style="padding:8px 18px;font-size:13px" onclick="act(${id},'approve')">Approve</button>
              <button class="sg-btn sg-btn-ghost" style="padding:8px 18px;font-size:13px" onclick="act(${id},'reject')">Reject</button>
            </div>` : `<span class="sg-badge ${current === 'approved' ? 'sg-badge-accent' : ''}">${current}</span>`}
          </div>
        </div>`;
        }).join('');
      } catch (error) {
        list.innerHTML = `<div class="admin-load-error" style="grid-column:1/-1"><strong>We couldn't load The Line.</strong><p>${sgEscapeHtml(error.message)}</p><button class="sg-btn sg-btn-ghost" id="retry-line" type="button">Try again</button></div>`;
        document.getElementById('retry-line').addEventListener('click', load);
      } finally {
        list.setAttribute('aria-busy', 'false');
        buttons.forEach(button => { button.disabled = false; });
      }
    }

    async function act(id, action) {
      await api(`/api/admin/line-submissions/${id}/${action}`, { method: 'POST' });
      toast(action === 'approve' ? 'Approved' : 'Rejected');
      load();
    }

    document.querySelectorAll('#filters button').forEach(b =>
      b.addEventListener('click', () => { current = b.dataset.status; load(); }));

    load();
  </script>
</body>
</html>

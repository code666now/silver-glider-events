<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.58" numOctaves="3" seed="37" stitchTiles="stitch" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0" result="grain-mono"/>
      <feComponentTransfer in="grain-mono" result="grain-contrast">
        <feFuncR type="linear" slope="1.65" intercept="-0.32"/>
        <feFuncG type="linear" slope="1.65" intercept="-0.32"/>
        <feFuncB type="linear" slope="1.65" intercept="-0.32"/>
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.16" numOctaves="4" seed="83" stitchTiles="stitch" result="fibers"/>
      <feColorMatrix in="fibers" type="saturate" values="0" result="fibers-mono"/>
      <feBlend in="grain-contrast" in2="fibers-mono" mode="multiply" result="paper-noise"/>
      <feGaussianBlur in="paper-noise" stdDeviation="0.12"/>
    </filter>
    <linearGradient id="fold-a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f6f6f" stop-opacity="0"/>
      <stop offset=".48" stop-color="#5d5d5d" stop-opacity=".38"/>
      <stop offset=".51" stop-color="#c7c7c7" stop-opacity=".34"/>
      <stop offset="1" stop-color="#878787" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fold-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#858585" stop-opacity="0"/>
      <stop offset=".62" stop-color="#545454" stop-opacity=".24"/>
      <stop offset=".64" stop-color="#c0c0c0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#858585" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="720" height="720" fill="#888"/>
  <rect width="720" height="720" filter="url(#paper)" opacity=".78"/>
  <rect x="82" width="58" height="720" fill="url(#fold-a)" opacity=".7"/>
  <rect y="396" width="720" height="46" fill="url(#fold-b)" opacity=".72"/>
  <g fill="none" stroke="#555" stroke-linecap="round" opacity=".28">
    <path d="M42 93c77 11 113-10 185 5s117 10 176-2 157-2 269 20" stroke-width="2"/>
    <path d="M18 581c85-15 163 8 224-5s130-3 190 10 143 7 270-12" stroke-width="1.5"/>
    <path d="M508 22c-16 86 14 142-3 218s2 139-8 210 3 141-10 248" stroke-width="1.2"/>
  </g>
</svg>
